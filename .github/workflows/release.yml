name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build wheel setuptools

      - name: Build Source and Wheel Distributions
        run: |
          python -m build

      - name: Prepare Standalone Executable and Distributions
        run: |
          mkdir -p release-assets
          cp dist/* release-assets/
          python -c '
          import zipapp, tempfile, os, shutil
          tmp = tempfile.mkdtemp()
          shutil.copy("main.py", os.path.join(tmp, "__main__.py"))
          shutil.copytree("core", os.path.join(tmp, "core"))
          zipapp.create_archive(tmp, "release-assets/focusshell", interpreter="/usr/bin/env python3")
          os.chmod("release-assets/focusshell", 0o755)
          shutil.rmtree(tmp)
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
