[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "focusshell"
version = "0.1.0"
description = "Digital Activity & Focus Tracker for the Terminal"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "FocusShell Developer" }
]
dependencies = [
    "rich>=13.0.0"
]

[project.scripts]
focusshell = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
